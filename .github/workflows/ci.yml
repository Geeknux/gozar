name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build # bidi lint + tsc --noEmit + vite build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gozar
          POSTGRES_USER: gozar
          POSTGRES_PASSWORD: gozar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOZAR_DB: ${{ matrix.db }}
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The DuckDB engine is an optional extra: the 3.13 jobs install it and run its
      # parity tests against the ORM on both databases; the 3.12 jobs run without it,
      # so the core install is tested on its own (the DuckDB tests skip there).
      - run: >-
          uv sync --python ${{ matrix.python }} --extra postgres
          ${{ matrix.python == '3.13' && '--extra duckdb' || '' }}
      - run: uv run python example_project/manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - if: matrix.python == '3.13'
        run: uv run pytest tests/test_duckdb.py -q -rs | tee duckdb.log && ! grep -q SKIPPED duckdb.log
